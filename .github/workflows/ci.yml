name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check atlas-project-architect/scripts/version.mjs
          node --check scripts/install-skill.mjs
          node --check scripts/generate-agents.mjs
          node --check scripts/setup-project.mjs

      - name: Tests
        run: node --test tests/version.test.mjs tests/install.test.mjs tests/agents.test.mjs tests/setup-project.test.mjs

      - name: Generated agents match the SSOT
        run: node scripts/generate-agents.mjs --check

      - name: Version SSOT is in sync
        run: node atlas-project-architect/scripts/version.mjs verify

      - name: sync is a no-op
        run: |
          node atlas-project-architect/scripts/version.mjs sync
          git diff --exit-code

      - name: Installer smoke test
        run: |
          node scripts/install-skill.mjs --dest .ci-skills
          test -f .ci-skills/atlas-project-architect/SKILL.md
          test -f .ci-skills/atlas-project-architect/references/07-versioning-ssot.md

      - name: Project setup smoke test
        run: |
          project="$(mktemp -d)"
          trap 'rm -rf "$project"' EXIT
          node scripts/setup-project.mjs --project "$project"
          test ! -f "$project/opencode.json"
          node scripts/setup-project.mjs --project "$project" --apply
          test -f "$project/opencode.json"
          test -f "$project/.opencode/agents/api-architect.md"
          test -f "$project/.agents/agents/api-architect.md"
          test -f "$project/.agents/skills/atlas-project-architect/SKILL.md"
