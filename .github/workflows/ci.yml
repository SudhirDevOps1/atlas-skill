name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check atlas-project-architect/scripts/version.mjs
          node --check scripts/install-skill.mjs
          node --check scripts/generate-agents.mjs
          node --check scripts/setup-project.mjs

      - name: Tests
        run: node --test tests/version.test.mjs tests/install.test.mjs tests/agents.test.mjs tests/setup-project.test.mjs

      - name: Generated agents match the SSOT
        run: node scripts/generate-agents.mjs --check

      - name: Version SSOT is in sync
        run: node atlas-project-architect/scripts/version.mjs verify

      - name: sync is a no-op
        run: |
          node atlas-project-architect/scripts/version.mjs sync
          git diff --exit-code

      - name: Installer smoke test
        run: |
          node scripts/install-skill.mjs --dest .ci-skills
          test -f .ci-skills/atlas-project-architect/SKILL.md
          test -f .ci-skills/atlas-project-architect/references/07-versioning-ssot.md

      - name: Project setup smoke test
        run: |
          mkdir -p .ci-project
          node scripts/setup-project.mjs --project .ci-project
          test ! -f .ci-project/opencode.json
          node scripts/setup-project.mjs --project .ci-project --apply
          test -f .ci-project/opencode.json
          test -f .ci-project/.opencode/agents/api-architect.md
          test -f .ci-project/.agents/agents/api-architect.md
          test -f .ci-project/.agents/skills/atlas-project-architect/SKILL.md
