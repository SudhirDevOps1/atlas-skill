
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="300"
     viewBox="0 0 1280 300"
     fill="none"
     role="img"
     aria-label="ATLAS Project Architect">

<title>ATLAS — Project Architect</title>
<desc>Premium animated technical banner for an autonomous project architect.</desc>

<defs>
  <!-- Background -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#05080D"/>
    <stop offset=".48" stop-color="#0B121B"/>
    <stop offset="1" stop-color="#121B27"/>
  </linearGradient>

  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE0A0"/>
    <stop offset=".5" stop-color="#D99A38"/>
    <stop offset="1" stop-color="#A96820"/>
  </linearGradient>

  <linearGradient id="titleGradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".7" stop-color="#E6EAF0"/>
    <stop offset="1" stop-color="#AAB6C4"/>
  </linearGradient>

  <radialGradient id="ambient">
    <stop offset="0" stop-color="#E8A33D" stop-opacity=".18"/>
    <stop offset="1" stop-color="#E8A33D" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="blueGlow">
    <stop offset="0" stop-color="#527A9F" stop-opacity=".15"/>
    <stop offset="1" stop-color="#527A9F" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="32" height="32"
           patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32"
          stroke="#9FB2C5"
          stroke-opacity=".065"
          stroke-width=".8"/>
  </pattern>

  <filter id="blur">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <filter id="goldGlow">
    <feGaussianBlur stdDeviation="3" result="blurred"/>
    <feMerge>
      <feMergeNode in="blurred"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <clipPath id="canvas">
    <rect width="1280" height="300"/>
  </clipPath>
</defs>

<style>
  * {
    box-sizing: border-box;
  }

  .ambient {
    animation: breathe 7s ease-in-out infinite alternate;
  }

  .grid {
    animation: gridMove 35s linear infinite;
  }

  .orbit {
    transform-origin: 1040px 148px;
    animation: rotate 30s linear infinite;
  }

  .orbit-reverse {
    transform-origin: 1040px 148px;
    animation: rotateReverse 22s linear infinite;
  }

  .pulse {
    animation: pulse 3s ease-in-out infinite;
  }

  .scan {
    animation: scan 6s ease-in-out infinite;
  }

  .particle {
    animation: float 5s ease-in-out infinite alternate;
  }

  .reveal {
    animation: reveal 1.3s ease-out both;
  }

  .reveal-delay {
    animation: reveal 1.3s .25s ease-out both;
  }

  .reveal-late {
    animation: reveal 1.3s .5s ease-out both;
  }

  @keyframes breathe {
    from { opacity: .55; }
    to { opacity: 1; }
  }

  @keyframes gridMove {
    from { transform: translate(0,0); }
    to { transform: translate(32px,32px); }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  @keyframes rotateReverse {
    to { transform: rotate(-360deg); }
  }

  @keyframes pulse {
    0%,100% { opacity: .5; }
    50% { opacity: 1; }
  }

  @keyframes scan {
    0%,100% { transform: translateX(-160px); opacity: 0; }
    20%,70% { opacity: .7; }
    90% { transform: translateX(1100px); opacity: 0; }
  }

  @keyframes float {
    from { transform: translateY(0); opacity: .35; }
    to { transform: translateY(-12px); opacity: .9; }
  }

  @keyframes reveal {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
    }
  }
</style>

<g clip-path="url(#canvas)">

  <!-- Base -->
  <rect width="1280" height="300" fill="url(#bg)"/>

  <!-- Ambient lights -->
  <ellipse class="ambient" cx="1040" cy="120"
           rx="280" ry="230" fill="url(#ambient)"/>

  <ellipse cx="340" cy="300"
           rx="300" ry="170" fill="url(#blueGlow)"/>

  <!-- Technical grid -->
  <rect width="1280" height="300"
        fill="url(#grid)" class="grid"/>

  <!-- Atmospheric light -->
  <ellipse cx="1080" cy="145" rx="130" ry="110"
           fill="#D89A3D" opacity=".08" filter="url(#blur)"/>

  <!-- Frame corners -->
  <g stroke="url(#gold)" stroke-width="1.4"
     stroke-opacity=".65">
    <path d="M38 66V38H66"/>
    <path d="M1242 66V38H1214"/>
    <path d="M38 234V262H66"/>
    <path d="M1242 234V262H1214"/>
  </g>

  <!-- Left identity -->
  <g class="reveal">

    <rect x="72" y="47" width="5" height="13"
          rx="2" fill="url(#gold)"/>

    <text x="88" y="58"
          font-family="Consolas, monospace"
          font-size="11"
          letter-spacing="4"
          fill="#A8B6C6">
      AUTONOMOUS PROJECT INTELLIGENCE
    </text>

    <text x="68" y="164"
          font-family="Inter, Segoe UI, sans-serif"
          font-size="88"
          font-weight="800"
          letter-spacing="9"
          fill="url(#titleGradient)">
      ATLAS
    </text>

    <!-- Gold underline -->
    <rect x="74" y="181" width="72" height="3"
          rx="1.5" fill="url(#gold)"
          filter="url(#goldGlow)"/>

  </g>

  <!-- Subtitle -->
  <g class="reveal-delay">

    <text x="74" y="216"
          font-family="Consolas, monospace"
          font-size="15"
          font-weight="600"
          letter-spacing="5"
          fill="#E8AD53">
      PROJECT ARCHITECT
    </text>

    <text x="74" y="247"
          font-family="Inter, Segoe UI, sans-serif"
          font-size="13"
          letter-spacing=".5"
          fill="#A1B0BF">
      Idea · Research · Build · Prove · Ship · Handoff
    </text>

  </g>

  <!-- Right technical compass -->
  <g>

    <!-- Outer circle -->
    <circle cx="1040" cy="148" r="108"
            stroke="#8094A9"
            stroke-opacity=".16"
            stroke-width="1"/>

    <circle cx="1040" cy="148" r="101"
            stroke="#A6B8C8"
            stroke-opacity=".3"
            stroke-width="3"
            stroke-dasharray="1 10"/>

    <!-- Rotating orbit -->
    <g class="orbit">
      <circle cx="1040" cy="148" r="88"
              stroke="#D99A38"
              stroke-opacity=".75"
              stroke-width="1.5"
              stroke-dasharray="110 445"
              stroke-linecap="round"/>

      <circle cx="1040" cy="60" r="4"
              fill="#F5C779"
              filter="url(#goldGlow)"/>
    </g>

    <g class="orbit-reverse">
      <circle cx="1040" cy="148" r="70"
              stroke="#8195A9"
              stroke-opacity=".55"
              stroke-width="1"
              stroke-dasharray="3 8"/>

      <circle cx="1040" cy="78" r="2.5"
              fill="#D99A38"/>
    </g>

    <!-- Inner rings -->
    <circle cx="1040" cy="148" r="49"
            stroke="#71869B"
            stroke-opacity=".3"
            stroke-width="1"/>

    <circle cx="1040" cy="148" r="28"
            stroke="#D99A38"
            stroke-opacity=".4"
            stroke-width="1"/>

    <!-- Crosshair -->
    <path d="M1040 34V262M926 148H1154"
          stroke="#8295A8"
          stroke-opacity=".2"
          stroke-width="1"/>

    <!-- Compass -->
    <path d="M1040 79L1050 138L1040 148L1030 138Z"
          fill="url(#gold)" opacity=".95"/>

    <path d="M1040 217L1030 158L1040 148L1050 158Z"
          fill="#8094A9" opacity=".35"/>

    <path d="M971 148L1030 138L1040 148L1030 158Z"
          fill="#8094A9" opacity=".25"/>

    <path d="M1109 148L1050 158L1040 148L1050 138Z"
          fill="#D99A38" opacity=".3"/>

    <!-- Core -->
    <circle cx="1040" cy="148" r="8"
            fill="#E5A747" opacity=".18"
            class="pulse"/>

    <circle cx="1040" cy="148" r="3"
            fill="#FFE0A0"
            filter="url(#goldGlow)"/>

    <!-- Floating particles -->
    <g fill="#E8A33D">
      <circle class="particle" cx="943" cy="98" r="2"/>
      <circle class="particle" cx="1128" cy="102" r="1.5"/>
      <circle class="particle" cx="1117" cy="214" r="2"/>
      <circle class="particle" cx="956" cy="204" r="1.5"/>
    </g>

  </g>

  <!-- Scan light -->
  <g class="scan">
    <rect x="0" y="0" width="100" height="300"
          fill="url(#ambient)" opacity=".3"/>
  </g>

  <!-- Right label -->
  <g class="reveal-late">
    <text x="1240" y="253"
          text-anchor="end"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="3"
          fill="#8295A8">
      SYSTEM / 001
    </text>

    <text x="1240" y="272"
          text-anchor="end"
          font-family="Consolas, monospace"
          font-size="9"
          letter-spacing="2.5"
          fill="#D8A04B">
      SINGLE SOURCE OF TRUTH
    </text>
  </g>

  <!-- Bottom accent -->
  <rect x="0" y="298" width="1280" height="2"
        fill="#283443"/>

  <rect x="72" y="298" width="120" height="2"
        fill="url(#gold)"/>

</g>
</svg>
