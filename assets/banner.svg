
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 300"
     width="1280" height="300"
     role="img" aria-label="ATLAS Apex Project Architect">

<title>ATLAS — Apex Project Architect</title>

<defs>
  <linearGradient id="background" x2="1" y2="1">
    <stop stop-color="#050607"/>
    <stop offset=".52" stop-color="#10151B"/>
    <stop offset="1" stop-color="#080C11"/>
  </linearGradient>

  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FFF0C9"/>
    <stop offset=".25" stop-color="#E7B86B"/>
    <stop offset=".55" stop-color="#A86C2D"/>
    <stop offset=".8" stop-color="#F4D69A"/>
    <stop offset="1" stop-color="#8D5927"/>
  </linearGradient>

  <linearGradient id="white" x2="1">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".65" stop-color="#DCE2E9"/>
    <stop offset="1" stop-color="#8795A4"/>
  </linearGradient>

  <linearGradient id="beam">
    <stop stop-color="#DDA64E" stop-opacity="0"/>
    <stop offset=".5" stop-color="#FFE1A0" stop-opacity=".65"/>
    <stop offset="1" stop-color="#DDA64E" stop-opacity="0"/>
  </linearGradient>

  <radialGradient id="goldLight">
    <stop stop-color="#E8AE54" stop-opacity=".24"/>
    <stop offset="1" stop-color="#E8AE54" stop-opacity="0"/>
  </radialGradient>

  <pattern id="blueprint" width="40" height="40"
           patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
          stroke="#B3C1CE"
          stroke-opacity=".045"
          fill="none"/>
    <circle cx="0" cy="0" r="1"
            fill="#D8B475" opacity=".2"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="22"/>
  </filter>

  <clipPath id="frame">
    <rect width="1280" height="300"/>
  </clipPath>
</defs>

<style>
  .orbit1 {
    transform-origin: 1050px 145px;
    animation: spin 32s linear infinite;
  }

  .orbit2 {
    transform-origin: 1050px 145px;
    animation: spinBack 24s linear infinite;
  }

  .orbit3 {
    transform-origin: 1050px 145px;
    animation: spin 65s linear infinite;
  }

  .core {
    transform-origin: 1050px 145px;
    animation: breathe 4s ease-in-out infinite;
  }

  .ambient {
    animation: ambient 8s ease-in-out infinite alternate;
  }

  .lightSweep {
    animation: sweep 8s ease-in-out infinite;
  }

  .intro {
    animation: intro 1.5s cubic-bezier(.2,.7,.2,1) both;
  }

  .intro2 {
    animation: intro 1.5s .25s cubic-bezier(.2,.7,.2,1) both;
  }

  .intro3 {
    animation: intro 1.5s .45s cubic-bezier(.2,.7,.2,1) both;
  }

  .particles {
    animation: float 5s ease-in-out infinite alternate;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes spinBack {
    to { transform: rotate(-360deg); }
  }

  @keyframes breathe {
    0%,100% { opacity: .65; transform: scale(.96); }
    50% { opacity: 1; transform: scale(1.04); }
  }

  @keyframes ambient {
    from { opacity: .45; }
    to { opacity: 1; }
  }

  @keyframes sweep {
    0%,12% { transform: translateX(-350px); opacity: 0; }
    25% { opacity: .7; }
    60% { opacity: .2; }
    85%,100% { transform: translateX(1500px); opacity: 0; }
  }

  @keyframes intro {
    from { opacity: 0; transform: translateY(18px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    from { transform: translateY(5px); opacity: .35; }
    to { transform: translateY(-8px); opacity: .9; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
    }
  }
</style>

<g clip-path="url(#frame)">

  <!-- Background -->
  <rect width="1280" height="300" fill="url(#background)"/>
  <rect width="1280" height="300" fill="url(#blueprint)"/>

  <!-- Atmospheric illumination -->
  <ellipse class="ambient" cx="1050" cy="145"
           rx="260" ry="210"
           fill="url(#goldLight)"/>

  <ellipse cx="1050" cy="145" rx="100" ry="95"
           fill="#D99A44" opacity=".09"
           filter="url(#soft)"/>

  <!-- Architectural borders -->
  <g stroke="url(#metal)" stroke-width="1"
     stroke-opacity=".6" fill="none">
    <path d="M35 65V35H65"/>
    <path d="M1245 65V35H1215"/>
    <path d="M35 235V265H65"/>
    <path d="M1245 235V265H1215"/>
  </g>

  <!-- Header -->
  <g class="intro">
    <rect x="74" y="52" width="26" height="1"
          fill="url(#metal)"/>

    <text x="110" y="56"
          fill="#B7C0CA"
          font-family="Consolas, monospace"
          font-size="10"
          letter-spacing="4">
      INTELLIGENT PROJECT ENGINEERING
    </text>

    <text x="70" y="165"
          fill="url(#white)"
          font-family="Inter, Segoe UI, sans-serif"
          font-size="91"
          font-weight="800"
          letter-spacing="12">
      ATLAS
    </text>

    <text x="75" y="194"
          fill="#C18B46"
          font-family="Consolas, monospace"
          font-size="9"
          letter-spacing="3">
      A SYSTEM FOR TURNING IDEAS INTO REALITY
    </text>
  </g>

  <!-- Main divider -->
  <g class="intro2">
    <rect x="75" y="213" width="430" height="1"
          fill="#687582" opacity=".35"/>

    <rect x="75" y="213" width="85" height="1.5"
          fill="url(#metal)"/>

    <text x="75" y="242"
          font-family="Consolas, monospace"
          font-size="14"
          letter-spacing="4"
          fill="#E8BD79">
      PROJECT ARCHITECT
    </text>

    <text x="75" y="264"
          font-family="Inter, sans-serif"
          font-size="11"
          letter-spacing="1"
          fill="#8795A4">
      IDEA / RESEARCH / BUILD / PROVE / SHIP / HANDOFF
    </text>
  </g>

  <!-- Compass architectural emblem -->
  <g>

    <!-- Outer rings -->
    <circle cx="1050" cy="145" r="111"
            stroke="#A5B4C2" stroke-opacity=".15"/>

    <circle cx="1050" cy="145" r="104"
            stroke="#A5B4C2" stroke-opacity=".25"
            stroke-width="2" stroke-dasharray="1 9"/>

    <g class="orbit1">
      <circle cx="1050" cy="145" r="91"
              stroke="url(#metal)" stroke-width="1.5"
              stroke-dasharray="100 472"
              stroke-linecap="round"/>

      <path d="M1050 54L1055 45L1060 54"
            stroke="#F7D99E" stroke-width="1.5"
            fill="none"/>
    </g>

    <g class="orbit2">
      <circle cx="1050" cy="145" r="75"
              stroke="#8998A8" stroke-opacity=".45"
              stroke-width="1"
              stroke-dasharray="2 7"/>

      <circle cx="1125" cy="145" r="3"
              fill="#E4B56D" filter="url(#glow)"/>
    </g>

    <g class="orbit3">
      <circle cx="1050" cy="145" r="61"
              stroke="#D8AC67" stroke-opacity=".35"
              stroke-width="1" stroke-dasharray="35 18 3 18"/>

      <path d="M1050 84V95"
            stroke="#E7C58E" stroke-width="2"/>
    </g>

    <!-- Coordinate cross -->
    <path d="M1050 27V263M932 145H1168"
          stroke="#8393A3" stroke-opacity=".2"
          stroke-width="1"/>

    <!-- Geometric star -->
    <g class="core" filter="url(#glow)">
      <path d="M1050 82L1067 145L1050 208L1033 145Z"
            fill="url(#metal)" opacity=".95"/>

      <path d="M987 145L1050 128L1113 145L1050 162Z"
            fill="#A77A42" opacity=".55"/>

      <path d="M1050 82L1050 208"
            stroke="#FFF0C9" stroke-opacity=".6"/>

      <circle cx="1050" cy="145" r="8"
              fill="#FFF0C9"/>
      <circle cx="1050" cy="145" r="3"
              fill="#80521F"/>
    </g>

    <!-- Floating stars -->
    <g fill="#EAC17F">
      <circle class="particles" cx="956" cy="89" r="1.5"/>
      <circle class="particles" cx="1137" cy="93" r="2"/>
      <circle class="particles" cx="1142" cy="210" r="1.5"/>
      <circle class="particles" cx="964" cy="214" r="2"/>
    </g>

    <!-- Compass labels -->
    <g fill="#9AA8B6"
       font-family="Consolas, monospace"
       font-size="7"
       letter-spacing="1">
      <text x="1050" y="23" text-anchor="middle">N</text>
      <text x="1050" y="277" text-anchor="middle">S</text>
      <text x="918" y="148" text-anchor="middle">W</text>
      <text x="1182" y="148" text-anchor="middle">E</text>
    </g>

  </g>

  <!-- Moving light beam -->
  <g class="lightSweep">
    <rect x="0" y="0" width="190" height="300"
          fill="url(#beam)" opacity=".35"/>
  </g>

  <!-- Footer -->
  <g class="intro3">
    <text x="1240" y="247"
          text-anchor="end"
          fill="#A6B1BD"
          font-family="Consolas, monospace"
          font-size="9"
          letter-spacing="2">
      ARCHITECTURE / 001
    </text>

    <text x="1240" y="266"
          text-anchor="end"
          fill="#DDB16D"
          font-family="Consolas, monospace"
          font-size="9"
          letter-spacing="2">
      SINGLE SOURCE OF TRUTH
    </text>
  </g>

  <!-- Bottom metallic edge -->
  <rect x="0" y="298" width="1280" height="2"
        fill="#303944"/>

  <rect x="75" y="298" width="145" height="2"
        fill="url(#metal)"/>

</g>
</svg>
